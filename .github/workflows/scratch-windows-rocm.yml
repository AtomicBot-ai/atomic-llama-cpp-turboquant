# Scratch: iterate on the windows-x64-rocm job alone (the full dev-build
# matrix costs hours of paid Windows/CUDA minutes per attempt). Delete this
# file once the job in dev-build.yml / release-turboquant.yml is final.
name: Scratch - Windows ROCm job

# workflow_dispatch only resolves workflows that exist on the default branch,
# so this one runs on push to its own branch instead.
on:
  workflow_dispatch:
  push:
    branches:
      - feat/windows-rocm-amd-bench
    paths:
      - '.github/workflows/scratch-windows-rocm.yml'
      - '.github/actions/windows-setup-rocm/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64-rocm:
    runs-on: windows-2022
    env:
      ROCM_VERSION: "10.0.0"
      GPU_TARGETS: "gfx1030;gfx1100;gfx1101;gfx1102;gfx1103;gfx1150;gfx1151;gfx1200;gfx1201"

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: turboquant-windows-x64-rocm
          max-size: 2G
          evict-old-files: 7d

      - name: Install Ninja
        run: choco install ninja -y

      - name: Setup ROCm
        uses: ./.github/actions/windows-setup-rocm
        with:
          version: ${{ env.ROCM_VERSION }}

      - name: Setup ROCm environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & C:\TheRock\build\.venv\Scripts\Activate.ps1
          rocm-sdk init
          if ($LASTEXITCODE -ne 0) { throw "rocm-sdk init failed with exit code $LASTEXITCODE" }
          $rocmPath = (rocm-sdk path --root).Trim()
          $cmakePath = (rocm-sdk path --cmake).Trim()
          $binPath = (rocm-sdk path --bin).Trim()
          Write-Host "ROCm root: $rocmPath"
          echo "HIP_PATH=$rocmPath" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$cmakePath" >> $env:GITHUB_ENV
          echo "HIP_DEVICE_LIB_PATH=$rocmPath\lib\llvm\amdgcn\bitcode" >> $env:GITHUB_ENV
          echo "HIP_PLATFORM=amd" >> $env:GITHUB_ENV
          echo "LLVM_PATH=$rocmPath\lib\llvm" >> $env:GITHUB_ENV
          echo "ROCM_BIN_PATH=$binPath" >> $env:GITHUB_ENV
          echo "$binPath" >> $env:GITHUB_PATH
          echo "C:\TheRock\build\.venv\Scripts" >> $env:GITHUB_PATH

      # Where do the ROCm 10 wheels keep the rocBLAS kernels? Printed before
      # the build so the answer is there even if a later step fails.
      - name: Inspect ROCm layout
        shell: pwsh
        continue-on-error: true
        run: |
          $sp = "C:\TheRock\build\.venv\Lib\site-packages"
          $out = @()
          foreach ($pkg in Get-ChildItem $sp -Directory -Filter "_rocm_sdk*") {
            $size = (Get-ChildItem $pkg.FullName -Recurse -File | Measure-Object -Property Length -Sum).Sum
            $out += ("== {0}  {1:N0} MiB" -f $pkg.Name, ($size / 1MB))
            foreach ($d in Get-ChildItem $pkg.FullName -Directory) {
              $s = (Get-ChildItem $d.FullName -Recurse -File | Measure-Object -Property Length -Sum).Sum
              $out += ("   {0,-24} {1,10:N1} MiB" -f $d.Name, ($s / 1MB))
            }
          }
          $out += "== directories named library / *rocblas* / *tensile* / *kpack*"
          Get-ChildItem $sp -Recurse -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq "library" -or $_.Name -match "rocblas|tensile|kpack|hipblaslt" } |
            ForEach-Object {
              $s = (Get-ChildItem $_.FullName -Recurse -File | Measure-Object -Property Length -Sum).Sum
              $n = (Get-ChildItem $_.FullName -Recurse -File | Measure-Object).Count
              $out += ("   {0}  ({1} files, {2:N1} MiB)" -f $_.FullName.Replace($sp, ""), $n, ($s / 1MB))
            }
          $out += "== every file above 4 MiB under _rocm_sdk_* (largest first)"
          Get-ChildItem "$sp\_rocm_sdk_core", "$sp\_rocm_sdk_libraries", "$sp\_rocm_sdk_devel" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Length -gt 4MB } | Sort-Object Length -Descending |
            ForEach-Object { $out += ("   {0,10:N1} MiB  {1}" -f ($_.Length / 1MB), $_.FullName.Replace($sp, "")) }
          $out += "== files without extension (kernel packs?)"
          Get-ChildItem "$sp\_rocm_sdk_core", "$sp\_rocm_sdk_libraries" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -eq "" } |
            ForEach-Object { $out += ("   {0,10:N1} MiB  {1}" -f ($_.Length / 1MB), $_.FullName.Replace($sp, "")) }
          $out += "== imports of the ROCm DLLs ggml-hip needs"
          $dumpbin = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*Hostx64\x64*" } | Select-Object -First 1
          if ($dumpbin) {
            foreach ($d in @("rocblas.dll", "hipblas.dll", "libhipblaslt.dll", "rocsolver.dll", "amdhip64_7.dll", "rocm_kpack.dll")) {
              $p = "$sp\_rocm_sdk_devel\bin\$d"
              if (-not (Test-Path $p)) { $out += "   -- $d: not in devel\bin"; continue }
              $out += ("   -- {0} ({1:N1} MiB)" -f $d, ((Get-Item $p).Length / 1MB))
              & $dumpbin.FullName /NOLOGO /DEPENDENTS $p 2>$null | Where-Object { $_ -match "^\s+\S+\.dll\s*$" } | ForEach-Object { $out += "      $($_.Trim())" }
            }
          }
          $out | Out-File rocm-layout.txt -Encoding utf8
          Get-Content rocm-layout.txt
          exit 0

      - name: Exclude build tree from Defender
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}", "$env:RUNNER_TEMP", "C:\TheRock"
            Add-MpPreference -ExclusionProcess "clang.exe", "clang++.exe", "lld.exe", "lld-link.exe", "ninja.exe"
          } catch {
            Write-Host "Defender exclusions unavailable: $_"
          }

      - name: Build
        shell: pwsh
        # On Windows ggml-hip compiles the .cu files as CXX with hip::device
        # (CXX_IS_HIPCC in ggml/src/ggml-hip/CMakeLists.txt), so CMAKE_HIP_FLAGS
        # is never used: --offload-compress has to go through CMAKE_CXX_FLAGS.
        # Without it ggml-hip.dll is 545 MB for 9 targets.
        # -Wno-ignored-attributes: 850k lines of GGML_API dllimport warnings per
        # build otherwise, which makes the job log unfetchable.
        run: |
          cmake -S . -B build -G "Ninja Multi-Config" `
            -DCMAKE_PREFIX_PATH="${env:HIP_PATH}" `
            -DCMAKE_C_COMPILER="${env:HIP_PATH}\lib\llvm\bin\clang.exe" `
            -DCMAKE_CXX_COMPILER="${env:HIP_PATH}\lib\llvm\bin\clang++.exe" `
            -DCMAKE_HIP_COMPILER="${env:HIP_PATH}\lib\llvm\bin\clang.exe" `
            -DCMAKE_C_FLAGS="-Wno-error=incompatible-pointer-types -Wno-ignored-attributes" `
            -DCMAKE_CXX_FLAGS="--offload-compress -Wno-ignored-attributes" `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DHIP_PATH="${env:HIP_PATH}" `
            -DHIP_PLATFORM=amd `
            -DGGML_HIP=ON `
            -DGPU_TARGETS="${env:GPU_TARGETS}" `
            -DGGML_BACKEND_DL=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_CPU=OFF `
            -DGGML_RPC=OFF `
            -DLLAMA_CURL=OFF `
            -DLLAMA_OPENSSL=OFF `
            -DLLAMA_BUILD_SERVER=OFF `
            -DLLAMA_BUILD_TOOLS=OFF `
            -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_EXAMPLES=OFF
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          Write-Host "== HIP flags in cache"
          Select-String -Path build\CMakeCache.txt -Pattern "CMAKE_HIP_FLAGS|CMAKE_HIP_ARCHITECTURES|GPU_TARGETS|AMDGPU_TARGETS" | ForEach-Object { $_.Line }
          Write-Host "== one HIP compile command (does --offload-compress reach clang?)"
          $cc = Get-Content build\compile_commands.json -Raw | ConvertFrom-Json
          $one = $cc | Where-Object { $_.file -like "*fattn-vec-instance-turbo3_0-turbo3_0.cu" } | Select-Object -First 1
          if ($one) { Write-Host $one.command } else { Write-Host "(no HIP entry found in compile_commands.json)" }
          cmake --build build --config Release --parallel ${env:NUMBER_OF_PROCESSORS} --target ggml-hip
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }

      - name: Verify HIP backend was built
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build\bin\Release -Filter "ggml-hip*.dll" -ErrorAction SilentlyContinue
          if (-not $dll) {
            Write-Host "##[error]ggml-hip*.dll was NOT produced."
            Get-ChildItem build\bin\Release | Format-Table -AutoSize
            exit 1
          }
          $dll | Format-Table FullName, Length -AutoSize
          New-Item -ItemType Directory -Force -Path hip-out | Out-Null
          Copy-Item build\bin\Release\ggml-hip.dll hip-out\
          Copy-Item rocm-layout.txt hip-out\

      - name: Bundle ROCm runtime
        shell: pwsh
        # The ROCm 10 wheels ship no rocBLAS kernel library: rocblas.dll imports
        # libhipblaslt.dll and kernels come from amd_comgr.dll at run time. So
        # the bundle is the import closure of ggml-hip.dll over the ROCm bin
        # dirs (amdhip64_7, rocm_kpack, amd_comgr, hipblas, rocblas,
        # libhipblaslt, rocsolver, ...). System DLLs are left alone.
        # amdhip64_7.dll must sit next to the binaries: the Adrenalin driver
        # ships its own copy in System32 and the loader searches the exe
        # directory first (ggml-org/llama.cpp#26929).
        run: |
          $ErrorActionPreference = "Stop"
          $sp = "C:\TheRock\build\.venv\Lib\site-packages"
          $bins = @("$sp\_rocm_sdk_devel\bin", "$sp\_rocm_sdk_core\bin", "$sp\_rocm_sdk_libraries\bin")
          $dumpbin = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*Hostx64\x64*" } | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          function Get-Imports($path) {
            & $dumpbin.FullName /NOLOGO /DEPENDENTS $path 2>$null |
              Where-Object { $_ -match "^\s+(\S+\.dll)\s*$" } | ForEach-Object { $Matches[1] }
          }
          $queue = [System.Collections.Generic.Queue[string]]::new()
          $queue.Enqueue("hip-out\ggml-hip.dll")
          $seen = @{ "ggml-hip.dll" = $true }
          while ($queue.Count -gt 0) {
            $p = $queue.Dequeue()
            foreach ($d in Get-Imports $p) {
              if ($seen.ContainsKey($d.ToLower())) { continue }
              $seen[$d.ToLower()] = $true
              $src = $null
              foreach ($b in $bins) { if (Test-Path "$b\$d") { $src = "$b\$d"; break } }
              if (-not $src) { continue }
              Copy-Item $src -Destination hip-out -Force
              Write-Host ("  {0,-22} {1,8:N1} MiB   needed by {2}" -f $d, ((Get-Item $src).Length / 1MB), (Split-Path $p -Leaf))
              $queue.Enqueue("hip-out\$d")
            }
          }
          $total = (Get-ChildItem -Path hip-out -File | Measure-Object -Property Length -Sum).Sum
          Write-Host ("  HIP backend payload total: {0:N1} MiB" -f ($total / 1MB))

      - name: Upload HIP backend
        uses: actions/upload-artifact@v4
        with:
          name: hip-windows-x64-rocm-scratch
          path: hip-out
          retention-days: 3
