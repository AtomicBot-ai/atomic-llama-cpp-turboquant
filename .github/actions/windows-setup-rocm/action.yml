name: "Windows - Setup ROCm"
description: "Install ROCm for Windows from the TheRock wheels (same layout as the upstream windows-rocm release job)"
inputs:
  version:
    description: "ROCm version, e.g. 10.0.0"
    required: true

runs:
  using: "composite"
  steps:
    - name: Install ROCm wheels
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        # The venv lives at a fixed path so the devel tree it expands can be
        # cached and does not need relocation.
        New-Item -Path "C:\TheRock\build" -ItemType Directory -Force | Out-Null
        python -m venv C:\TheRock\build\.venv
        & C:\TheRock\build\.venv\Scripts\Activate.ps1

        python -m pip install --upgrade pip
        # Multi-arch wheels: one install covers every gfx target we build for.
        python -m pip install --index-url https://stable.repo.amd.com/rocm/whl-next/ "rocm[libraries,devel]==${{ inputs.version }}"

        rocm-sdk init
        if ($LASTEXITCODE -ne 0) { throw "rocm-sdk init failed with exit code $LASTEXITCODE" }
        Write-Host "ROCm ${{ inputs.version }} installed under C:\TheRock\build"
