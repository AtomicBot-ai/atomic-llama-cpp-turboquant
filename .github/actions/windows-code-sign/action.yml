name: "Windows - Code Signing"
description: "Authenticode-sign Windows binaries with the code signing key in Azure Key Vault"

# The private key lives in an Azure Key Vault Premium HSM and never leaves it:
# AzureSignTool hashes each file on the runner and asks Key Vault to sign the
# digest. The job signs in to Azure through GitHub OIDC (no stored secret), so
# the calling job needs `permissions: id-token: write` and must run in the
# `codesign` environment, which the app's federated credential is bound to.
# The identifiers come from that environment's variables.
#
# The Azure sign-in happens here, right before signing, and not at job start:
# the OIDC session cannot be refreshed, and the CUDA and ROCm builds compile
# for longer than it lives.

inputs:
  path:
    description: "Directory holding the .exe/.dll files to sign (not searched recursively)"
    required: true
  client-id:
    description: "Entra application (client) ID that may sign (vars.AZURE_CLIENT_ID)"
    required: true
  tenant-id:
    description: "Entra tenant ID (vars.AZURE_TENANT_ID)"
    required: true
  key-vault:
    description: "Key Vault name (vars.AZURE_KEY_VAULT)"
    required: true
  certificate:
    description: "Certificate name in the Key Vault (vars.AZURE_CODESIGN_CERT)"
    required: true
  scope:
    description: >-
      Which .exe/.dll files to sign and check: "all", or "runtime" = the files
      matching runtime-patterns (what the app runs). Every signed file is a Key
      Vault signing call plus a timestamp request; with "runtime" the other
      tools in the archive (llama-cli, llama-bench, test binaries, ...) stay
      unsigned.
    required: false
    default: "all"
  runtime-patterns:
    description: >-
      Comma-separated file name wildcards for scope "runtime": llama-server.exe
      and the DLLs it loads (the CPU backend variants are ggml-cpu-*.dll), plus
      the CUDA runtime the CUDA archives bundle (NVIDIA's redistributable
      archives ship it unsigned).
    required: false
    default: "llama-server.exe,llama-server-impl.dll,llama.dll,llama-common.dll,mtmd.dll,ggml*.dll,cudart64_*.dll,cublas64_*.dll,cublasLt64_*.dll"

runs:
  using: "composite"
  steps:
    - name: Sign in to Azure (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        allow-no-subscriptions: true

    - name: Install AzureSignTool
      shell: pwsh
      run: |
          $maxAttempts = 5
          for ($i = 1; $i -le $maxAttempts; $i++) {
            dotnet tool install --global AzureSignTool --version 7.0.1
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "AzureSignTool install attempt $i/$maxAttempts failed"
            if ($i -eq $maxAttempts) { throw "Could not install AzureSignTool" }
            Start-Sleep -Seconds ($i * 10)
          }
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Setup Windows SDK signtool
      shell: pwsh
      run: |
          # Only used to verify signatures; signing goes through AzureSignTool.
          $signtoolPath = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*\x64\*" } |
            Sort-Object { [version]($_.FullName -replace '.*\\(\d+\.\d+\.\d+\.\d+)\\.*', '$1') } -Descending |
            Select-Object -First 1
          if (-not $signtoolPath) {
            Write-Error "signtool.exe not found in Windows SDK"
            exit 1
          }
          Write-Host "Found signtool at: $($signtoolPath.DirectoryName)"
          echo "$($signtoolPath.DirectoryName)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Sign binaries
      shell: pwsh
      env:
        SIGN_PATH: ${{ inputs.path }}
        SIGN_SCOPE: ${{ inputs.scope }}
        SIGN_RUNTIME_PATTERNS: ${{ inputs.runtime-patterns }}
        KEY_VAULT: ${{ inputs.key-vault }}
        CERT_NAME: ${{ inputs.certificate }}
      run: |
          $dir = Resolve-Path -LiteralPath $env:SIGN_PATH
          if ($env:SIGN_SCOPE -notin 'all', 'runtime') { throw "scope must be 'all' or 'runtime', not '$env:SIGN_SCOPE'" }
          $patterns = $env:SIGN_RUNTIME_PATTERNS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          $files = Get-ChildItem -Path $dir -File | Where-Object {
            $n = $_.Name
            ($_.Extension -in '.exe', '.dll') -and
              ($env:SIGN_SCOPE -eq 'all' -or @($patterns | Where-Object { $n -like $_ }).Count -gt 0)
          }
          if (-not $files) { throw "No .exe/.dll (scope $env:SIGN_SCOPE) found under $dir" }
          if ($env:SIGN_SCOPE -eq 'runtime' -and -not ($files | Where-Object { $_.Name -eq 'llama-server.exe' })) {
            throw "scope runtime: llama-server.exe not found under $dir"
          }

          $toSign = @()
          $skipped = 0
          foreach ($f in $files) {
            # CUDA and HIP redistributables arrive signed by their vendor;
            # leave them alone.
            if ((Get-AuthenticodeSignature -LiteralPath $f.FullName).Status -eq 'Valid') {
              Write-Host "Skipping (already signed): $($f.Name)"
              $skipped++
              continue
            }
            $toSign += $f
          }

          if ($toSign.Count -gt 0) {
            $token = az account get-access-token --resource https://vault.azure.net --query accessToken -o tsv
            if ($LASTEXITCODE -ne 0 -or -not $token) { throw "Could not get a Key Vault access token" }
            Write-Host "::add-mask::$token"

            $list = Join-Path $env:RUNNER_TEMP "sign-list.txt"
            $toSign.FullName | Out-File -FilePath $list -Encoding utf8
            Write-Host "Signing $($toSign.Count) file(s) with $env:CERT_NAME from $env:KEY_VAULT"
            AzureSignTool sign `
              --azure-key-vault-url "https://$env:KEY_VAULT.vault.azure.net" `
              --azure-key-vault-certificate $env:CERT_NAME `
              --azure-key-vault-accesstoken $token `
              --file-digest sha256 `
              --timestamp-rfc3161 http://timestamp.digicert.com `
              --timestamp-digest sha256 `
              --max-degree-of-parallelism 4 `
              --input-file-list $list
            if ($LASTEXITCODE -ne 0) { throw "AzureSignTool failed (exit $LASTEXITCODE)" }
          }

          foreach ($f in $toSign) {
            signtool verify /pa $f.FullName | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $($f.FullName)" }
          }

          Write-Host "Signed $($toSign.Count) file(s), skipped $skipped already-signed file(s)"

    - name: Report signature status
      shell: pwsh
      env:
        SIGN_PATH: ${{ inputs.path }}
        SIGN_SCOPE: ${{ inputs.scope }}
        SIGN_RUNTIME_PATTERNS: ${{ inputs.runtime-patterns }}
      run: |
          $dir = Resolve-Path -LiteralPath $env:SIGN_PATH
          $patterns = $env:SIGN_RUNTIME_PATTERNS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          $unsigned = @()
          # every .exe/.dll is listed; with scope runtime only the runtime files must be signed
          foreach ($f in (Get-ChildItem -Path $dir -File | Where-Object { $_.Extension -in '.exe', '.dll' })) {
            $n = $f.Name
            $inScope = $env:SIGN_SCOPE -eq 'all' -or @($patterns | Where-Object { $n -like $_ }).Count -gt 0
            $sig = Get-AuthenticodeSignature -LiteralPath $f.FullName
            Write-Host ("{0,-28} {1,-12} {2}" -f $f.Name, $sig.Status, $sig.SignerCertificate.Subject)
            if ($inScope -and $sig.Status -eq 'NotSigned') { $unsigned += $f.Name }
          }
          if ($unsigned.Count -gt 0) { throw "Unsigned binaries in archive: $($unsigned -join ', ')" }
